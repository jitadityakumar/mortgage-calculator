services:
  backend:
    image: mortgage-calculator-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    environment:
      - DATABASE_URL=sqlite:////data/mortgage.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  frontend:
    image: mortgage-calculator-frontend:latest
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  db-data:
